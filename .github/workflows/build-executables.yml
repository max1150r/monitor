name: Compilar ejecutables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: StockWatch-Windows
            executable: dist/StockWatch.exe
          - os: ubuntu-latest
            artifact: StockWatch-Linux
            executable: dist/StockWatch
          - os: macos-latest
            artifact: StockWatch-macOS
            executable: dist/StockWatch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar herramientas de compilación
        run: python -m pip install -r requirements-build.txt
      - name: Compilar StockWatch
        run: python -m PyInstaller --noconfirm --clean StockWatch.spec
      - name: Verificar el ejecutable
        run: python -c "from pathlib import Path; assert Path(r'${{ matrix.executable }}').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
